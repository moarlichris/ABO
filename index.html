<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#198754">
  <title>QR Abo Scanner</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root { --green:#198754; --red:#dc3545; --gray:#f5f5f5; --dark:#212529; }
    * { box-sizing:border-box; }
    body { font-family:Arial,sans-serif; max-width:800px; margin:auto; padding:20px; background:var(--gray); color:var(--dark); }
    h1 { text-align:center; }
    .tabs { display:flex; gap:10px; margin-bottom:20px; }
    .tabs button { flex:1; }
    button { width:100%; padding:12px; border:0; border-radius:8px; background:var(--green); color:white; cursor:pointer; font-weight:bold; margin-top:10px; }
    button:hover { opacity:.9; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .secondary { background:#6c757d; }
    .danger { background:var(--red); }
    .panel { display:none; background:white; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
    .panel.active { display:block; }
    input { width:100%; padding:12px; margin-bottom:10px; border:1px solid #bbb; border-radius:8px; }
    #qrcode { display:flex; justify-content:center; margin-top:20px; }
    #qrcode img, #qrcode canvas { max-width:100%; height:auto; }
    #reader { width:100%; min-height:280px; }
    .result { padding:15px; border-radius:8px; margin-top:15px; text-align:center; white-space:pre-wrap; overflow-wrap:anywhere; }
    .valid { background:#d4edda; color:#155724; }
    .expired { background:#f8d7da; color:#721c24; font-weight:bold; }
    .info { background:#e7f1ff; color:#084298; }
    .history-item {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      background:#eee;
      padding:10px;
      margin-bottom:7px;
      border-radius:6px;
      overflow-wrap:anywhere;
    }

    .history-item button {
      flex-shrink:0;
      margin-top:0;
    }

    .history-text {
      flex:1;
    }
    .expired-item { border-left:5px solid var(--red); }
    .valid-item { border-left:5px solid var(--green); }
    .hint { font-size:.9rem; color:#555; line-height:1.45; }
    .button-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .button-row button { margin-top:10px; }
    @media (max-width:520px) { .tabs, .button-row { grid-template-columns:1fr; display:grid; } }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>QR Abo-Verwaltung</h1>
    <h2>Anmeldung</h2>

    <p class="hint">
      Bitte mit Benutzername und Passwort anmelden.
    </p>

    <form id="loginForm" autocomplete="on">
      <label for="loginUsername">
        <strong>Benutzername</strong>
      </label>

      <input
        id="loginUsername"
        name="username"
        type="text"
        maxlength="50"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
      >

      <label for="loginPassword">
        <strong>Passwort</strong>
      </label>

      <input
        id="loginPassword"
        name="password"
        type="password"
        maxlength="100"
        autocomplete="current-password"
        required
      >

      <button type="submit">Anmelden</button>
    </form>

    <div id="loginMessage" aria-live="polite"></div>
  </div>
</div>

<div id="protectedApp" hidden>
  
  <h1>QR Abo-Verwaltung</h1>

  <div class="tabs">
    <button type="button" data-panel="create">Erstellen</button>
    <button type="button" data-panel="scan">Scannen</button>
    <button type="button" data-panel="history">Liste</button>
  </div>

  <section id="create" class="panel active">
    <label for="qrText"><strong>Abo-Kennung</strong></label>
    <input id="qrText" type="text" maxlength="120" placeholder="z. B. Kunde-12345" autocomplete="off">
    <button type="button" id="createQrBtn">QR-Code erstellen</button>
    <div id="qrcode" aria-live="polite"></div>
    <div class="button-row">
      <button type="button" id="downloadBtn" class="secondary" hidden>Als PNG speichern</button>
      <button type="button" id="shareBtn" class="secondary" hidden>Bild versenden</button>
    </div>
  </section>

  <section id="scan" class="panel">
    <p class="hint">Die Seite muss über HTTPS geöffnet sein. Beim ersten Start muss der Kamerazugriff erlaubt werden.</p>
    <div id="reader"></div>
    <div id="scanResult" aria-live="polite"></div>
    <button type="button" id="restartBtn" class="secondary">Scanner neu starten</button>
  </section>

  <section id="history" class="panel">
    <h2>Scan-Historie</h2>
    <div id="historyList"></div>
    <button type="button" id="clearBtn" class="danger">Alle Daten löschen</button>
  </section>

  <script>
    "use strict";
/*
 * LOKALER ZUGRIFFSSCHUTZ
 *
 * ACHTUNG:
 * Benutzernamen und Passwörter stehen in dieser HTML-Datei und können
 * über den Quelltext eingesehen werden. Dies ist kein sicherer,
 * serverseitiger Zugriffsschutz.
 */
const USERS = [
  { username: "benutzer1", password: "Passwort1!" },
  { username: "benutzer2", password: "Passwort2!" },
  { username: "benutzer3", password: "Passwort3!" },
  { username: "benutzer4", password: "Passwort4!" },
  { username: "benutzer5", password: "Passwort5!" }
];

const LOGIN_SESSION_KEY = "aboScannerLoggedIn";
const LOGIN_USER_KEY = "aboScannerCurrentUser";
const MAX_LOGIN_ATTEMPTS = 5;
const LOGIN_BLOCK_TIME = 30000;

let loginAttempts = 0;
let loginBlockedUntil = 0;

    const STORAGE_KEY = "aboScans";
    const MAX_SCANS = 10;
    let scanner = null;
    let scanLocked = false;

    const byId = (id) => document.getElementById(id);

    function setResult(message, cssClass) {
      const box = document.createElement("div");
      box.className = "result " + cssClass;
      box.textContent = message;
      byId("scanResult").replaceChildren(box);
    }

    function loadData() {
      try {
        const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return value && typeof value === "object" && !Array.isArray(value) ? value : {};
      } catch (error) {
        console.error("Gespeicherte Daten sind ungültig:", error);
        return {};
      }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    async function showPanel(id) {
      document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("active"));
      byId(id).classList.add("active");

      if (id === "scan") {
        await startScanner();
      } else {
        await stopScanner();
      }

      if (id === "history") renderHistory();
    }

    function generateQR() {
      const text = byId("qrText").value.trim();
      if (!text) {
        alert("Bitte eine Abo-Kennung eingeben.");
        return;
      }

      byId("qrcode").replaceChildren();
      new QRCode(byId("qrcode"), {
        text: text,
        width: 250,
        height: 250,
        correctLevel: QRCode.CorrectLevel.H
      });

      byId("downloadBtn").hidden = false;
      byId("shareBtn").hidden = false;
    }

    function qrCanvas() {
      const existingCanvas = byId("qrcode").querySelector("canvas");
      if (existingCanvas) return existingCanvas;

      const image = byId("qrcode").querySelector("img");
      if (!image) return null;

      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth || 250;
      canvas.height = image.naturalHeight || 250;
      canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
      return canvas;
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    }

    async function downloadQR() {
      const canvas = qrCanvas();
      if (!canvas) {
        alert("Bitte zuerst einen QR-Code erstellen.");
        return;
      }
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = "abo-qr-code.png";
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function shareQR() {
      const canvas = qrCanvas();
      if (!canvas) {
        alert("Bitte zuerst einen QR-Code erstellen.");
        return;
      }

      const blob = await canvasToBlob(canvas);
      if (!blob) {
        alert("Das Bild konnte nicht erzeugt werden.");
        return;
      }

      const file = new File([blob], "abo-qr-code.png", { type: "image/png" });
      const shareData = { title: "Abo QR-Code", text: "Abo QR-Code", files: [file] };

      if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (error) {
          if (error.name === "AbortError") return;
          console.error("Teilen fehlgeschlagen:", error);
        }
      }

      await downloadQR();
      alert("Direktes Teilen wird von diesem Browser nicht unterstützt. Das Bild wurde stattdessen gespeichert.");
    }

    async function startScanner() {
      if (scanner || scanLocked) return;
      byId("scanResult").replaceChildren();

      if (!window.isSecureContext) {
        setResult("Kamerazugriff benötigt HTTPS. Öffne die veröffentlichte GitHub-Pages-Adresse.", "expired");
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setResult("Dieser Browser stellt keinen Kamerazugriff bereit.", "expired");
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        setResult("Die Scanner-Bibliothek wurde nicht geladen. Prüfe die Internetverbindung und den Script-Link.", "expired");
        return;
      }

      try {
        scanner = new Html5Qrcode("reader");
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
          onScanSuccess,
          function () {}
        );
      } catch (error) {
        console.error("Kamerafehler:", error);
        scanner = null;
        const name = error && error.name ? error.name : "Fehler";
        const detail = error && error.message ? error.message : String(error);
        setResult("Kamera konnte nicht gestartet werden. " + name + ": " + detail + "\nBitte Kameraberechtigung und HTTPS prüfen.", "expired");
      }
    }

    async function stopScanner() {
      const current = scanner;
      scanner = null;
      if (!current) return;
      try {
        if (current.isScanning) await current.stop();
      } catch (error) {
        console.warn("Scanner konnte nicht gestoppt werden:", error);
      }
      try {
        await current.clear();
      } catch (error) {
        console.warn("Scanner konnte nicht geleert werden:", error);
      }
    }

    async function restartScanner() {
      scanLocked = false;
      await stopScanner();
      byId("scanResult").replaceChildren();
      await startScanner();
    }

    async function onScanSuccess(decodedText) {
      if (scanLocked) return;
      scanLocked = true;
      await stopScanner();

      const code = String(decodedText || "").trim();
      if (!code || code.length > 500) {
        setResult("Ungültiger QR-Code.", "expired");
        return;
      }

      const data = loadData();
      const previous = Number.isInteger(data[code]) ? data[code] : 0;

      if (previous >= MAX_SCANS) {
        setResult("🚨 ABO ABGELAUFEN\n\n" + code + "\nNutzung: " + previous + " / " + MAX_SCANS, "expired");
        renderHistory();
        return;
      }

      const count = previous + 1;
      data[code] = count;
      saveData(data);

      if (count >= MAX_SCANS) {
        setResult("🚨 ABO JETZT ABGELAUFEN\n\n" + code + "\nDas war Scan " + count + " / " + MAX_SCANS, "expired");
      } else {
        setResult("✅ Scan erfolgreich\n\n" + code + "\nNutzung: " + count + " / " + MAX_SCANS, "valid");
      }
      renderHistory();
    }

function renderHistory() {
  const history = byId("historyList");
  history.replaceChildren();

  const data = loadData();
  const keys = Object.keys(data).sort((a, b) =>
    a.localeCompare(b)
  );

  if (keys.length === 0) {
    const empty = document.createElement("p");
    empty.textContent = "Keine Einträge vorhanden.";
    history.appendChild(empty);
    return;
  }

  keys.forEach((key) => {
    const count = data[key];

    const item = document.createElement("div");
    item.className =
      "history-item " +
      (count >= MAX_SCANS
        ? "expired-item"
        : "valid-item");

    const text = document.createElement("div");
    text.className = "history-text";

    text.textContent =
      (count >= MAX_SCANS ? "❌ " : "✅ ") +
      key +
      " | " +
      count +
      " / " +
      MAX_SCANS +
      (count >= MAX_SCANS
        ? " | ABO ABGELAUFEN"
        : "");

    const deleteBtn =
      document.createElement("button");

    deleteBtn.textContent = "🗑 Löschen";
    deleteBtn.className = "danger";

    deleteBtn.style.width = "auto";
    deleteBtn.style.padding = "6px 12px";

    deleteBtn.addEventListener(
      "click",
      () => deleteEntry(key)
    );

    item.appendChild(text);
    item.appendChild(deleteBtn);

    history.appendChild(item);
  });
}

      function deleteEntry(key) {
        if (!confirm(`Eintrag "${key}" löschen?`)) return;

        const data = loadData();

        delete data[key];

        saveData(data);

        byId("scanResult").replaceChildren();

        renderHistory();
      }

    async function clearAll() {
      if (!confirm("Alle gespeicherten Scan-Daten löschen?")) return;
      localStorage.removeItem(STORAGE_KEY);
      byId("scanResult").replaceChildren();
      renderHistory();
      alert("Daten wurden gelöscht.");
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("[data-panel]").forEach((button) => {
        button.addEventListener("click", () => showPanel(button.dataset.panel));
      });
      byId("createQrBtn").addEventListener("click", generateQR);
      byId("downloadBtn").addEventListener("click", downloadQR);
      byId("shareBtn").addEventListener("click", shareQR);
      byId("restartBtn").addEventListener("click", restartScanner);
      byId("clearBtn").addEventListener("click", clearAll);
      byId("qrText").addEventListener("keydown", (event) => {
        if (event.key === "Enter") generateQR();
      });
      renderHistory();
    });

    window.addEventListener("pagehide", () => { stopScanner(); });
  </script>
</body>
</html>
