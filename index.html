<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Abo Scanner</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
https://unpkg.com/html5-qrcodescript>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tabs button{
    flex:1;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#198754;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.panel{
    display:none;
    background:white;
    padding:20px;
    border-radius:10px;
}

.panel.active{
    display:block;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    box-sizing:border-box;
}

#qrcode{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

.result{
    padding:15px;
    border-radius:8px;
    margin-top:15px;
    text-align:center;
}

.valid{
    background:#d4edda;
    color:#155724;
}

.expired{
    background:#f8d7da;
    color:#721c24;
    font-weight:bold;
}

.history-item{
    background:#eee;
    padding:10px;
    margin-bottom:5px;
    border-radius:6px;
}
</style>
</head>

<body>

<h1>QR Abo Verwaltung</h1>

<div class="tabs">
    <button onclick="showPanel('create')">Erstellen</button>
    <button onclick="showPanel('scan')">Scannen</button>
    <button onclick="showPanel('history')">Liste</button>
</div>

<div id="create" class="panel active">

    <input
        id="qrText"
        type="text"
        placeholder="Abo Kennung eingeben">

    <button onclick="generateQR()">
        QR Code erstellen
    </button>

    <div id="qrcode"></div>

</div>

<div id="scan" class="panel">

    <div id="reader"></div>

    <div id="scanResult"></div>

    <button onclick="restartScanner()" style="margin-top:15px">
        Scanner neu starten
    </button>

</div>

<div id="history" class="panel">

    <div id="historyList"></div>

    <button
        onclick="clearAll()"
        style="background:#dc3545;margin-top:20px">

        Alle Daten löschen
    </button>

</div>

<script>

let scanner = null;

function showPanel(id){

    document.querySelectorAll(".panel")
        .forEach(panel => panel.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");

    if(id === "scan"){
        startScanner();
    }else{
        stopScanner();
    }

    if(id === "history"){
        renderHistory();
    }
}

function generateQR(){

    const text =
        document.getElementById("qrText")
        .value
        .trim();

    if(!text){
        alert("Bitte Kennung eingeben");
        return;
    }

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(
        document.getElementById("qrcode"),
        {
            text:text,
            width:250,
            height:250
        }
    );
}

async function startScanner(){

    if(scanner){
        return;
    }

    scanner = new Html5Qrcode("reader");

    try{

        const cameras =
            await Html5Qrcode.getCameras();

        if(cameras.length === 0){
            alert("Keine Kamera gefunden");
            return;
        }

        await scanner.start(
            cameras[0].id,
            {
                fps:10,
                qrbox:250
            },
            onScanSuccess
        );

    } catch(error){

        console.error(error);

        document.getElementById("scanResult")
            .innerHTML =
            "<div class='result expired'>Kamera konnte nicht gestartet werden.</div>";
    }
}

async function stopScanner(){

    if(!scanner){
        return;
    }

    try{
        await scanner.stop();
    }catch(e){}

    try{
        await scanner.clear();
    }catch(e){}

    scanner = null;
}

async function restartScanner(){

    await stopScanner();

    document.getElementById("scanResult")
        .innerHTML = "";

    startScanner();
}

function onScanSuccess(decodedText){

    stopScanner();

    let data =
        JSON.parse(
            localStorage.getItem("aboScans")
        ) || {};

    if(!data[decodedText]){
        data[decodedText] = 0;
    }

    data[decodedText]++;

    localStorage.setItem(
        "aboScans",
        JSON.stringify(data)
    );

    const count = data[decodedText];

    const result =
        document.getElementById("scanResult");

    if(count >= 10){

        result.innerHTML =
        `
        <div class="result expired">
            🚨 ABO ABGELAUFEN<br><br>
            ${decodedText}<br>
            Nutzung: ${count}
        </div>
        `;

    } else {

        result.innerHTML =
        `
        <div class="result valid">
            ✅ Scan erfolgreich<br><br>
            ${decodedText}<br>
            Nutzung: ${count} / 10
        </div>
        `;
    }
}

function renderHistory(){

    const history =
        document.getElementById("historyList");

    let data =
        JSON.parse(
            localStorage.getItem("aboScans")
        ) || {};

    history.innerHTML = "";

    const keys =
        Object.keys(data);

    if(keys.length === 0){

        history.innerHTML =
            "Keine Einträge vorhanden.";

        return;
    }

    keys.forEach(key => {

        const div =
            document.createElement("div");

        div.className =
            "history-item";

        div.innerHTML =
            key + " : " +
            data[key] +
            " / 10";

        history.appendChild(div);

    });
}

function clearAll(){

    if(confirm("Alle Daten löschen?")){

        localStorage.removeItem("aboScans");

        renderHistory();
    }
}

</script>

</body>
</html>
